name: Process production mail/notification queue

# Hostinger shared hosting has no persistent worker process and no crontab
# CLI access for this account, so a scheduled SSH command from here is the
# reliable stand-in cron. queue:work must run as a genuine SSH/CLI process —
# outbound network calls (mail) triggered directly from a real web request
# on this host are unreliable (proven via repeated side-by-side tests), so
# this can't be replaced with a web-triggered cron alternative.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Run queue:work over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USERNAME }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          script: |
            cd ~/domains/cctvexpresstacurong.com/public_html
            php artisan queue:work --stop-when-empty --tries=3
